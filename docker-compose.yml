services:
  # Service Base de données (MariaDB)
  db:
    image: mariadb:10.11
    container_name: hackathon_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hackathon_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - hackathon-net

  # Service Backend (Node.js)
  backend:
    build: ./backend
    container_name: hackathon_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=hackathon_db
    depends_on:
      - db
    networks:
      - hackathon-net

volumes:
  db_data:

networks:
  hackathon-net:
    driver: bridge